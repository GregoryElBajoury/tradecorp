services:
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradecorp_spark
    ports:
      - "8889:8888"
      - "4041:4040"
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/work
      - ./src:/home/jovyan/src
      - ./tests:/home/jovyan/tests
      - ./data/tmp/tradecorp_raw:/home/jovyan/data/tmp/tradecorp_raw
    env_file:
      - .env
    environment:
      PYSPARK_SUBMIT_ARGS: "--packages org.postgresql:postgresql:42.7.0 pyspark-shell"

  postgres:
    image: postgres:16
    container_name: tradecorp_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tradecorp_pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8082:80"
    depends_on:
      - postgres

  airflow_postgres:
    image: postgres:16
    container_name: tradecorp_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow_db
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: tradecorp_airflow
    restart: always
    depends_on:
      - airflow_postgres
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./data/trigger:/opt/airflow/data/trigger
      - ./.env:/opt/airflow/.env
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@admin.com --password admin || true &&
      airflow webserver &
      airflow scheduler
      "

volumes:
  pgdata:
  airflow_pgdata: